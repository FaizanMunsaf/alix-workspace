name: "alix"

services:
  db:
    container_name: alix-db
    image: pgvector/pgvector:pg16
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-contract_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-postgres} -d $${DB_NAME:-contract_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alix-shared-net

  backend:
    container_name: alix-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: alix-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alix-shared-net

  frontend:
    container_name: alix-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - alix-shared-net

networks:
  alix-shared-net:
    name: alix-shared-net
    driver: bridge
