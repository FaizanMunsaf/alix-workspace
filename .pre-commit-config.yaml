repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.1
    hooks:
      - id: ruff
        files: ^backend/
        exclude: \.ipynb$
      - id: ruff-format
        files: ^backend/
        exclude: \.ipynb$

  - repo: local
    hooks:
      - id: eslint-frontend
        name: eslint (frontend)
        entry: npm run lint --prefix frontend
        language: system
        files: ^frontend/
        pass_filenames: false
